# Local PostHog for Aura — service mesh + datastores (2026-08-13).
#
# Only PostHog runs locally; the app keeps using its normal Supabase/RevenueCat/
# backend. The `posthog/posthog` image is NOT a monolith any more — the Django
# image (web/worker) serves only the UI + REST API. The two paths the Aura app
# actually uses were split into dedicated Rust services in PostHog's service
# split:
#   • event capture      → `capture`        (/e, /i/v0, /batch, /capture)
#   • feature flags       → `feature-flags`  (/flags, local-evaluation)
# A small `caddy` front door owns host :8000 and routes each path to the service
# that owns it (see Caddyfile), so the app sees one origin exactly like cloud.
#
# EVERY IMAGE IS PINNED (M28). Upstream publishes no release-matched tags for the
# split services — capture/feature-flags/posthog-node ship only rolling `master`/
# `latest` plus transient `sha-*` builds, and even PostHog's own hobby/base
# compose runs them rolling. So the app+MinIO pin to stable release tags (the
# ClickHouse 26.6.2.158 migrations this stack was validated against come from the
# release-1.43 era), and the three service images are snapshotted to immutable
# `sha-*` tags captured 2026-09-11 so a `docker compose pull` today == tomorrow.
# To upgrade, bump the app tag AND the three shas together, then re-verify the
# smoke suite.
#
#   ./up.sh      → http://localhost:8000  (first boot runs migrations, 2–5 min)
#   ./down.sh    (add --volumes to wipe)

name: aura-posthog

x-posthog: &posthog
  image: posthog/posthog:release-1.43.1
  restart: on-failure
  environment: &posthog-env
    DEBUG: '0'
    DISABLE_SECURE_SSL_REDIRECT: '1'
    IS_BEHIND_PROXY: 'false'
    SECRET_KEY: 'aura_local_dev_secret_change_me_0123456789abcdef'
    SITE_URL: 'http://localhost:8000'
    DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
    REDIS_URL: 'redis://redis:6379/'
    CLICKHOUSE_HOST: 'clickhouse'
    CLICKHOUSE_DATABASE: 'posthog'
    CLICKHOUSE_SECURE: 'false'
    CLICKHOUSE_VERIFY: 'false'
    KAFKA_HOSTS: 'kafka:9092'
    KAFKA_URL: 'kafka://kafka:9092'
    OBJECT_STORAGE_ENABLED: 'true'
    OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    clickhouse: { condition: service_healthy }
    kafka: { condition: service_healthy }
    objectstorage: { condition: service_started }

services:
  db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U posthog']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: zookeeper:3.8
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: 'ruok,srvr,mntr,conf, zk'
      ZOO_STANDALONE_ENABLED: 'true'
    # PERSISTENT volumes are load-bearing: ClickHouse's 91 ReplicatedMergeTree
    # tables keep their replica metadata in ZooKeeper (/clickhouse/tables/…). With
    # no volume, any ZK restart wipes that subtree; CH then can't recreate it (it's
    # only written at CREATE TABLE time), so every replicated table drops to
    # readonly and NO insert — event ingestion included — can land. See RUNBOOK §1c.
    volumes:
      - zkdata:/data
      - zkdatalog:/datalog
    healthcheck:
      # bash /dev/tcp — the zookeeper image ships bash but not always nc.
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/2181']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    # Must match the version PostHog's migrations target: they pin 26.6.2.158,
    # and 26.6 is the floor for features the migrations use — e.g. TTL on a
    # DateTime64 column, which 24.x rejects with "TTL expression result column
    # should have DateTime or Date type" (Code 450) partway through the schema.
    #
    # NOT the -alpine variant: PostHog's funnel UDF binaries (aggregate_funnel) are
    # glibc-linked and fail under Alpine's musl ("error while loading shared
    # libraries: libgcc_s.so.1"), so every funnel with real data crashes the UDF
    # (ATTEMPT_TO_READ_AFTER_EOF). The Debian image (what PostHog ships) runs them.
    image: clickhouse/clickhouse-server:26.6
    restart: unless-stopped
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      KAFKA_HOSTS: 'kafka:9092'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      # PostHog's own config (clusters, macros, settings) + a tiny override for
      # this environment (IPv4 listen, ZooKeeper). Both merge into config.d.
      - ./clickhouse/posthog-default.xml:/etc/clickhouse-server/config.d/posthog-default.xml:ro
      - ./clickhouse/listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro
      # PostHog's funnel/trends math runs as ClickHouse executable UDFs
      # (aggregate_funnel, …). Without these, every funnel insight errors with
      # "Function with name `aggregate_funnel` does not exist" and the tile just
      # dumps its SQL. The XML (bare-named, the deploy config — not the versioned
      # cloud-migration variant) is auto-loaded via CH's default `*_function.*ml`
      # glob; the scripts dir holds the `aggregate_funnel` wrapper + arch binaries
      # it shells out to. up.sh extracts user_scripts from the image (gitignored).
      - ./clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml:ro
      - ./clickhouse/user_scripts:/var/lib/clickhouse/user_scripts:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30

  kafka:
    image: redpandadata/redpanda:v24.2.7
    # unless-stopped: a reactor-stall abort exits non-zero AND a clean drain can
    # exit 0; either way we want it back, not left down taking capture/ingestion
    # with it.
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      # Stability on a shared, IO-constrained Docker VM. Once the ingestion
      # consumers joined, Redpanda's single reactor stalled for seconds (up to 17s)
      # and the seastar watchdog aborted it — a restart loop that rebalanced every
      # Kafka consumer and stopped ClickHouse's engine tables from ever draining
      # clickhouse_events_json into `events`. --overprovisioned stops the reactor
      # busy-polling (yields CPU instead of spinning), --unsafe-bypass-fsync drops
      # the fsync waits that caused the disk-IO stalls. Both are standard for local
      # dev (we don't need Redpanda durability here) and end the crash loop.
      - --overprovisioned
      - --unsafe-bypass-fsync=true
      - --default-log-level=warn
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30

  objectstorage:
    # Pinned to the exact MinIO release PostHog's own hobby compose ships
    # (docker-compose.hobby.yml) rather than :latest.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: on-failure
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes: [miniodata:/data]

  # One-shot schema migration, run before web/worker so `docker-server`'s
  # migrate-check passes on first boot (it exits under `set -e` while migrations
  # are pending, which otherwise crash-loops web hundreds of times).
  #
  # Postgres THEN ClickHouse, sequentially and on purpose: `migrate_clickhouse`
  # reads the `posthog_instancesetting` Postgres table, so running the two in
  # parallel (which `bin/migrate` does) races a fresh DB and dies. Both are
  # idempotent, so this is a cheap no-op on every boot after the first.
  migrate:
    <<: *posthog
    restart: 'no'
    # `bash -c`, NOT `-lc`: a login shell re-sources profile files and resets PATH
    # away from the image's /python-runtime, so `python` can't import Django. A
    # plain -c inherits the entrypoint's PATH, same as the other services' commands.
    #
    # SYSTEM FLUSH LOGS between the two migrates is load-bearing: one CH migration
    # creates a monitoring VIEW over `system.crash_log`, a system table CH only
    # materialises after its first crash — so on a healthy fresh server it doesn't
    # exist and migrate_clickhouse dies with "Unknown table system.crash_log". The
    # flush force-creates all configured *_log tables (crash_log included) empty.
    command:
      - bash
      - -c
      - >-
        python manage.py migrate &&
        python -c "import urllib.request; urllib.request.urlopen('http://clickhouse:8123/', data=b'SYSTEM FLUSH LOGS')" &&
        python manage.py migrate_clickhouse

  web:
    <<: *posthog
    command: ./bin/docker-server
    # Nginx Unit's stock entrypoint only loads the app's listener config when
    # /var/lib/unit is EMPTY — but this image ships certs/ and scripts/ there, so
    # the check fails, config load is "skipped", and Unit comes up with an empty
    # `listeners: {}` → nothing binds :8000 → every request gets 000. This flag
    # takes bin/docker-server-unit's other branch: it pre-bakes the rendered
    # config into a fresh --statedir and starts unitd against it, sidestepping the
    # empty-dir check completely. (It also avoids the double-worker-load startup.)
    environment:
      <<: *posthog-env
      NGINX_UNIT_PRELOAD_CONFIG: 'true'
      # 2 Unit worker processes, not the image default of 4. Each forks a full
      # Django (~1GB); 4 of them plus the celery worker overran the 7.5GB Docker VM
      # and the OOM killer took a Unit worker mid-boot ("app process exited on
      # signal 9" → 502). Two is plenty of concurrency for a local rig.
      NGINX_UNIT_APP_PROCESSES: '2'
      # Django resolves flags itself for some server-side paths; point it at the
      # Rust flags service so those agree with what the app gets over /flags.
      FEATURE_FLAGS_SERVICE_URL: 'http://feature-flags:3001'
    depends_on:
      migrate: { condition: service_completed_successfully }
    # No host port — caddy is the front door on :8000 and proxies to web:8000.
    expose: ['8000']

  # Celery worker — async background jobs (insight refresh, cohort recalcs, etc.).
  # NOT in the app's request path: capture and flag reads never touch it, so it's
  # here for UI completeness, not for the integration the app depends on.
  # WEB_CONCURRENCY=1 caps it to a single fork (~1GB); the default forks several
  # full-Django workers and, stacked on web, overruns the 7.5GB Docker VM.
  worker:
    <<: *posthog
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      <<: *posthog-env
      WEB_CONCURRENCY: '1'
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Event capture (Rust). Owns /e, /i/v0, /batch, /capture — the SDK's ingest
  # paths. Accepts the event over HTTP and produces it to Kafka, returning 200 to
  # the client (the SDK's whole contract). The `ingestion` service below then
  # moves those Kafka events on into ClickHouse. Env mirrors PostHog's own
  # docker-compose.base.yml, with redis/kafka pointed at this stack's services.
  #
  # restart: unless-stopped (not on-failure) — capture treats a Kafka broker blip
  # as a CLEAN shutdown (exit 0), and on-failure won't restart an exit-0 container,
  # so a momentary Redpanda restart would silently leave capture down (→ Caddy 502
  # on /i/*). unless-stopped brings it back regardless of exit code.
  capture:
    # M28 snapshot (immutable sha, captured 2026-09-11). See header.
    image: ghcr.io/posthog/posthog/capture:sha-e92b38153bfd
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ADDRESS: '0.0.0.0:3000'
      CAPTURE_MODE: 'events'
      KAFKA_HOSTS: 'kafka:9092'
      KAFKA_TOPIC: 'events_plugin_ingestion'
      REDIS_URL: 'redis://redis:6379/'
      RUST_LOG: 'info,rdkafka=warn'
      # The v1 sink router requires EVERY topic var below — a missing one panics
      # the process at boot ("Environment variable TOPIC_* is missing"). This is
      # the complete set from PostHog's docker-compose.base.yml. Redpanda
      # auto-creates the topics on first produce, so they need not pre-exist.
      CAPTURE_V1_SINKS: 'msk'
      CAPTURE_V1_SINK_MSK_KAFKA_HOSTS: 'kafka:9092'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN: 'events_plugin_ingestion'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL: 'events_plugin_ingestion_historical'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW: 'events_plugin_ingestion_overflow'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ: 'events_plugin_ingestion_dlq'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION: 'ingestion-errortracking-main'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP: 'heatmaps_ingestion'
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING: 'ingestion-clientwarnings-main-1'
    expose: ['3000']

  # Feature-flag resolution (Rust). Owns /flags + local-evaluation. Reads flag
  # definitions straight from the migrated Postgres (the same DB Django writes to
  # when you create a flag in the UI) and caches in Redis. It hard-requires a
  # MaxMind GeoIP DB at MAXMIND_DB_PATH and refuses to boot without it (geoip init
  # failure → shutdown), so up.sh extracts the .mmdb PostHog bundles in its own
  # image into ./share and we mount it here. See RUNBOOK §GeoIP.
  feature-flags:
    image: ghcr.io/posthog/posthog/feature-flags:sha-ff7795a
    restart: on-failure
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./share:/share:ro
    environment:
      ADDRESS: '0.0.0.0:3001'
      WRITE_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      READ_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      PERSONS_WRITE_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      PERSONS_READ_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
      REDIS_URL: 'redis://redis:6379/'
      COOKIELESS_REDIS_HOST: 'redis'
      COOKIELESS_REDIS_PORT: '6379'
      RUST_LOG: 'info'
    healthcheck:
      # This image ships curl, not wget — a wget-based check reports a false
      # "unhealthy" while the service is actually serving fine on :3001.
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3001/_readiness || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ['3001']

  # Event INGESTION (plugin-server, Node). Consumes captured events from Kafka
  # (events_plugin_ingestion) and writes them into ClickHouse — the step that
  # makes events actually appear in Activity / insights / funnels. Without it
  # capture still 200s the SDK but nothing lands in CH (this is the §1b caveat,
  # now lifted). Env mirrors PostHog's docker-compose.base.yml `ingestion-general`
  # with redis pointed at our `redis`. personhog is intentionally omitted — the
  # base dev compose runs this mode with in-process person handling, no separate
  # personhog-router. AI-blob offload is left unset so any $ai_* payloads store
  # inline (the app sends none anyway).
  ingestion:
    # M28 snapshot (immutable sha, captured 2026-09-11). See header.
    image: posthog/posthog-node:sha-260d904
    restart: unless-stopped
    command: node nodejs/dist/index.js
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Same GeoIP DB the flags service uses — the plugin-server looks for it at
    # ../share (i.e. /code/share) to geo-enrich events; without it, it logs a
    # warning and skips geo (non-fatal). Reuse the one up.sh already extracted.
    volumes:
      - ./share/GeoLite2-City.mmdb:/code/share/GeoLite2-City.mmdb:ro
    environment:
      PLUGIN_SERVER_MODE: 'ingestion-v2-combined'
      DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
      KAFKA_HOSTS: 'kafka:9092'
      REDIS_URL: 'redis://redis:6379/'
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_DATABASE: 'posthog'
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      COOKIELESS_REDIS_HOST: 'redis'
      COOKIELESS_REDIS_PORT: '6379'
      CDP_REDIS_HOST: 'redis'
      ENCRYPTION_SALT_KEYS: '00beef0000beef0000beef0000beef00'
      SECRET_KEY: 'aura_local_dev_secret_change_me_0123456789abcdef'

  # Front door. Presents one origin on :8000 and routes each path to the service
  # that owns it (web / capture / feature-flags). This is what makes the app see a
  # single PostHog host exactly like cloud does. See ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: on-failure
    depends_on:
      web: { condition: service_started }
      capture: { condition: service_started }
      feature-flags: { condition: service_started }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    # Loopback-only: local dev creds — the stack must never listen on the LAN
    # (L25/319). `docker compose up` from another machine on the LAN still
    # reaches it via the Docker VM's bridge; only the port EXPOSE is constrained.
    ports: ['127.0.0.1:8000:8000']

volumes:
  pgdata:
  chdata:
  redpanda:
  miniodata:
  caddydata:
  zkdata:
  zkdatalog:
